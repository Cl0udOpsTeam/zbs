apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zbs.api.fullname" . }}
  labels:
    {{- include "zbs.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  # ZBS API keeps job state in memory and coordinates backups/restores
  # itself, so it must run as exactly one replica. Recreate avoids overlapping
  # pods during upgrades (two schedulers would double-book backups).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "zbs.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zbs.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zbs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.listenPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "zbs.fullname" . }}
            - secretRef:
                name: {{ include "zbs.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Writable scratch space: the root filesystem is read-only, but
            # Python (tempfile) still expects a usable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
