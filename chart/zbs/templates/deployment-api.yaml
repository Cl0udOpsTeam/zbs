apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zbs.api.fullname" . }}
  labels:
    {{- include "zbs.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  # ZBS API keeps job state in memory and coordinates backups/restores
  # itself, so it must run as exactly one replica. Recreate avoids overlapping
  # pods during upgrades (two schedulers would double-book backups).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "zbs.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zbs.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zbs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.listenPort }}
              protocol: TCP
          env:
            {{- if .Values.config.s3CaBundle }}
            # Point the botocore S3 client at the CA bundle the chart mounts
            # below. Without this, verify=True uses only the system trust store.
            - name: ZBS_S3_CA_BUNDLE
              value: /etc/ssl/zbs/{{ .Values.config.s3CaBundleFileName }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "zbs.fullname" . }}
            - secretRef:
                name: {{ include "zbs.secretName" . }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Writable scratch space: the root filesystem is read-only, but
            # Python (tempfile) still expects a usable /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.s3CaBundle }}
            # Custom CA bundle for verifying the S3 endpoint's TLS cert. The
            # ConfigMap key s3CaBundleFileName holds the certificate data.
            - name: s3-ca-bundle
              mountPath: /etc/ssl/zbs/{{ .Values.config.s3CaBundleFileName }}
              subPath: {{ .Values.config.s3CaBundleFileName }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.s3CaBundle }}
        - name: s3-ca-bundle
          configMap:
            name: {{ include "zbs.fullname" . }}
            items:
              - key: {{ .Values.config.s3CaBundleFileName }}
                path: {{ .Values.config.s3CaBundleFileName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
