apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zbs.ui.fullname" . }}
  labels:
    {{- include "zbs.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  # The UI is stateless and safe to scale; this is also the pod where an
  # auth proxy sidecar (ui.sidecars) would live.
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zbs.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zbs.selectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zbs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          env:
            - name: ZBS_UI_PORT
              value: {{ .Values.ui.containerPort | quote }}
            - name: ZBS_API_UPSTREAM
              value: {{ include "zbs.ui.apiUpstream" . | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.ui.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Writable scratch space: the root filesystem is read-only, but
            # nginx-unprivileged still writes temp/cache data under /tmp and
            # /var/cache/nginx. The docker-entrypoint envsubst script also
            # renders templates into /etc/nginx/conf.d at startup.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
        {{- with .Values.ui.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
        {{- with .Values.ui.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
