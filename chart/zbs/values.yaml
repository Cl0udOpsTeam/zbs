# Default values for the zbs chart.
# Two applications are deployed: "api" (back end, internal) and "ui"
# (front end nginx, public entry point). Non-secret runtime configuration
# lands in a ConfigMap consumed by the API pod; credentials in a Secret.

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Shared pod scheduling (applies to both api and ui deployments).
nodeSelector: {}
tolerations: []
affinity: {}

service:
  api:
    type: ClusterIP
    port: 80
  ui:
    type: ClusterIP
    port: 80

# ---------------------------------------------------------------------------
# Vanilla-Kubernetes Ingress for the UI (alternative to the OpenShift Route).
# Gate it with whatever auth your ingress provides - the UI is the public
# entry point and must be protected.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Image used by the `helm test` smoke-test pod (hits /readyz and /healthz).
tests:
  image:
    repository: curlimages/curl
    tag: "8.14.1@sha256:cf21c4317a3b0629605fa43efdc9d64d0419913931ce9d8c258bf1a98a4472e2"
    pullPolicy: IfNotPresent

route:
  # OpenShift Route to the UI service - the public entry point (and the
  # natural place for router-level authentication annotations).
  enabled: false
  # Empty host -> OpenShift assigns <route-name>.<cluster-domain>.
  host: ""
  path: ""
  annotations: {}
  tls:
    enabled: false
    # edge | passthrough | reencrypt
    termination: edge
    # None | Allow | Redirect (edge/reencrypt only)
    insecureEdgeTerminationPolicy: Redirect
    # Optional PEM material for edge/reencrypt termination:
    certificate: ""
    key: ""
    caCertificate: ""
    destinationCACertificate: ""

# ---------------------------------------------------------------------------
# Application configuration -> ConfigMap (consumed by the API container)
# ---------------------------------------------------------------------------
config:
  listenPort: "8080"

  # Log verbosity: DEBUG | INFO | WARNING | ERROR | CRITICAL
  logLevel: "INFO"

  # Comma-separated host:port list of the ZooKeeper ensemble client ports,
  # e.g. "zk-0.zk-headless.zk.svc.cluster.local:2181,zk-1.zk-headless.zk.svc.cluster.local:2181".
  zkHosts: "zookeeper.zookeeper.svc.cluster.local:2181"

  # Subtree to back up / restore. "/" backs up everything except /zookeeper.
  zkRoot: "/"
  zkSessionTimeout: "15"

  # Seconds between automatic backups. "0" disables the scheduler.
  # Durations accept plain seconds or units: "45s", "5m", "2h", "1d".
  backupIntervalSeconds: "3600"

  # Retention: delete backups in S3 older than retentionMaxAge.
  # Accepts "24h" (one day), "7d"/"1w" (one week), "30d" and so on, or plain
  # seconds. Empty/"0" disables deletion entirely (default - opt in!).
  retentionMaxAge: ""
  # How often the retention sweeper checks for expired backups.
  retentionInterval: "6h"
  # Never delete the newest N backups, even if they are older than maxAge.
  retentionMinKeep: "1"

  # Replay stored ACLs on restore (requires sufficient ZK permissions).
  restoreAcls: "false"

  s3Bucket: ""
  s3Region: "us-east-1"
  # Legacy single-folder prefix. Still used when clusterFolder is empty
  # (keys then land under e.g. "zbs/"); ignored as a target once
  # clusterFolder is set, but remains browsable/restoreable either way.
  s3Prefix: "zbs/"
  # Empty = real AWS S3. For MinIO e.g. "http://minio.minio.svc.cluster.local:9000".
  s3Endpoint: ""

  # S3 TLS verification.
  # - s3VerifySSL="false" disables certificate verification entirely (DANGER:
  #   traffic becomes vulnerable to MITM; only use for short-lived test endpoints).
  # - s3CaBundle is a PEM (or single-file DER/base64-encoded) bundle of trusted
  #   CAs to verify the endpoint's certificate against. Empty = botocore default
  #   trust store. The chart writes this into the ConfigMap under the key
  #   named in s3CaBundleFileName and mounts it into the API pod at
  #   /etc/ssl/zbs/<s3CaBundleFileName>, then sets ZBS_S3_CA_BUNDLE at that path.
  # - s3CaBundleFileName picks the on-disk filename for the bundle. botocore
  #   reads PEM contents regardless of extension, so .crt / .cer / .pem all
  #   work; pick whatever your cert pipeline produces. Must be a basename
  #   (no slashes, no '..') and have one of: .pem .crt .cer .key.
  s3VerifySSL: "true"
  s3CaBundle: ""
  s3CaBundleFileName: "ca-bundle.pem"

  # ---------------------------------------------------------------------------
  # Multi-cluster folders - each folder is one ZooKeeper cluster's backup set,
  # conventionally named ENVIRONMENT-NAMESPACE-ZOOKEEPER_NAME,
  # e.g. "dev-test-my-zookeeper" -> dev-test-my-zookeeper/zbs-<ts>.json.gz
  # ---------------------------------------------------------------------------
  # Comma-separated allow-list of folders. Empty = auto-discover every folder
  # at the bucket root.
  s3Folders: ""
  # Where THIS instance uploads its own backups. Empty = legacy mode: uploads
  # go to the plain s3Prefix above. Must be listed in s3Folders when that is set.
  clusterFolder: ""
  # Folders retention may clean up. Empty = ONLY this instance's own folder.
  # s3Folders only grants BROWSING of other clusters' backups - deleting them
  # requires explicitly listing folders here. Keep this narrow when multiple
  # deployments share one bucket.
  retentionFolders: ""

# ---------------------------------------------------------------------------
# Credentials -> Secret (set existingSecret to manage the Secret yourself)
# ---------------------------------------------------------------------------
secret:
  existingSecret: ""
  zkUsername: ""
  zkPassword: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

# ---------------------------------------------------------------------------
# Back end (API)
# ---------------------------------------------------------------------------
api:
  image:
    repository: ghcr.io/example/zbs-api
    pullPolicy: IfNotPresent
    # Overrides the image tag, whose default is "v{{ .Chart.AppVersion }}".
    tag: ""

  # Prometheus-Operator ServiceMonitor scraping the API's /metrics endpoint.
  # Requires the prometheus-operator CRDs; without them use scrape annotations
  # or plain /metrics via your own discovery.
  serviceMonitor:
    enabled: false
    interval: "30s"
    labels: {}

  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Front end (UI) - nginx serving the SPA and proxying /api to the API service
# ---------------------------------------------------------------------------
ui:
  image:
    repository: ghcr.io/example/zbs-ui
    pullPolicy: IfNotPresent
    # Overrides the image tag, whose default is "v{{ .Chart.AppVersion }}".
    tag: ""

  # Stateless - safe to scale out.
  replicaCount: 1

  # Horizontal pod autoscaling for the stateless UI. When enabled, the
  # Deployment's static `replicas` field is omitted and autoscaling governs
  # the count (replicaCount is ignored).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # Voluntary-disruption protection; only rendered when replicaCount > 1
  # (with one replica a PDB would block every drain for no benefit).
  podDisruptionBudget:
    enabled: true

  # Port nginx listens on inside the container.
  containerPort: "8080"

  # Port the UI Service forwards to. Keep it equal to containerPort by
  # default; if you add an auth-proxy sidecar that should receive traffic
  # first (and forward to nginx afterwards), set this to its port instead,
  # e.g. "4180" for oauth2-proxy.
  targetPort: "8080"

  # Where nginx proxies /api. Empty = this release's API Service
  # (http://<release>-zbs-api.<namespace>.svc.cluster.local:<listenPort>).
  apiUpstream: ""

  # Extra containers appended to the UI pod - e.g. your auth proxy
  # (oauth2-proxy, tinyauth, ...) forwarding to localhost:<containerPort>.
  sidecars: []
  # Example:
  # sidecars:
  #   - name: auth-proxy
  #     image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
  #     args: ["--upstream=http://127.0.0.1:8080", "--http-address=0.0.0.0:4180"]
  #     ports:
  #       - name: proxy
  #         containerPort: 4180

  # Volumes referenced by sidecars (configs, cookie secrets, ...).
  extraVolumes: []
  # Example:
  # extraVolumes:
  #   - name: proxy-config
  #     configMap: {name: my-oauth2-proxy}

  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
